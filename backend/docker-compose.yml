services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vectorcore
      POSTGRES_PASSWORD: vectorcore_dev
      POSTGRES_DB: vectorcore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectorcore -d vectorcore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL:-postgresql://vectorcore:vectorcore_dev@postgres:5432/vectorcore}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_me_to_something_secure}
      - PORT=4000
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
