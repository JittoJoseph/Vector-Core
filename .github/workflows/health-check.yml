name: Keep Vector-Core Awake

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (UTC)
  workflow_dispatch:

concurrency:
  group: keep-vector-core-awake
  cancel-in-progress: true

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Ping health endpoint with retries
        env:
          URL: https://vector-core.onrender.com/ping
          MAX_ATTEMPTS: 8
          SLEEP_SECONDS: 10
          FORCE_SUCCESS: true
        run: |
          set -euo pipefail
          attempts=0

          echo "Starting keep-awake loop for $URL"

          while [ $attempts -lt "$MAX_ATTEMPTS" ]; do
            attempts=$((attempts + 1))
            echo "Attempt #$attempts..."

            raw=$(curl -sS -m 15 -H "Accept: application/json, text/html;q=0.9" -w "\n%{http_code}" "$URL" || true)
            http_code=$(echo "$raw" | tail -n1)
            body=$(echo "$raw" | sed '$d' || true)

            echo "HTTP code: $http_code"

            if [ "$http_code" = "200" ]; then
              if echo "$body" | jq -e . >/dev/null 2>&1; then
                status=$(echo "$body" | jq -r '.status // empty' || true)
                echo "Received JSON response. status=$status"
                echo "✅ Service awake."
                exit 0
              else
                echo "200 response received."
                echo "✅ Service awake."
                exit 0
              fi
            else
              echo "Not 200 (got $http_code). Retrying in ${SLEEP_SECONDS}s..."
            fi

            sleep "$SLEEP_SECONDS"
          done

          echo "Reached max attempts ($MAX_ATTEMPTS)."

          if [ "${FORCE_SUCCESS:-false}" = "true" ]; then
            echo "FORCE_SUCCESS=true — exiting successfully."
            exit 0
          else
            exit 1
          fi
